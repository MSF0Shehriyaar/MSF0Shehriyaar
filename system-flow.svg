    <g><rect x="361" y="81" width="198" height="114" rx="13" fill="url(#card)" stroke="#536CBE"/><rect x="380" y="102" width="37" height="37" rx="10" fill="#1E2A5E"/><text x="398" y="128" text-anchor="middle" font-size="19" fill="#99B7FF">{ }</text><text x="431" y="122" font-size="21" font-weight="700" fill="#F1F8FF">Backend</text><text x="380" y="166" font-size="15" fill="#A4B8E4">Java · Spring Boot</text></g>
    <g><rect x="662" y="81" width="199" height="114" rx="13" fill="url(#card)" stroke="#8266CC"/><rect x="681" y="102" width="37" height="37" rx="10" fill="#32224F"/><circle cx="699" cy="114" r="5" fill="#C6A3FF"/><path d="M691 124H707" stroke="#C6A3FF" stroke-width="2"/><text x="732" y="122" font-size="21" font-weight="700" fill="#F1F8FF">Data</text><text x="681" y="166" font-size="15" fill="#BBB2E6">SQL · Firebase · APIs</text></g>
    <g><rect x="951" y="81" width="200" height="114" rx="13" fill="url(#card)" stroke="#9B6FE0"/><rect x="970" y="102" width="37" height="37" rx="10" fill="#382055"/><text x="988" y="128" text-anchor="middle" font-size="23" fill="#E1B5FF">✦</text><text x="1020" y="122" font-size="21" font-weight="700" fill="#F1F8FF">AI Layer</text><text x="970" y="166" font-size="15" fill="#C4B0E2">Gemini · Llama</text></g>
