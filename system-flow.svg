<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated full-stack system architecture pipeline">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="50%" stop-color="#091226"/>
      <stop offset="100%" stop-color="#100D28"/>
    </linearGradient>
    <linearGradient id="neonBus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13203C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141838" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="flowClip">
      <rect width="1198" height="258" x="1" y="1" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#flowClip)">
    <rect width="1200" height="260" fill="url(#flowBg)"/>
    
    <!-- Header HUD -->
    <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#38BDF8">SYSTEM ARCHITECTURE PIPELINE // DATA &amp; INFERENCE FLOW</text>
    <text x="1150" y="42" font-family="'Consolas', monospace" font-size="11" text-anchor="end" fill="#34D399">● STATUS: LOW LATENCY BUS</text>

    <!-- Main Conduit Rail -->
    <path d="M 260 140 H 350 M 560 140 H 650 M 860 140 H 950" stroke="url(#neonBus)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Module 1: Frontend -->
    <g transform="translate(50, 75)">
      <rect width="210" height="126" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect width="210" height="34" rx="12" fill="#0E233C" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Icon pill -->
      <rect x="14" y="8" width="34" height="18" rx="4" fill="#081829" stroke="#38BDF8" stroke-width="1"/>
      <text x="31" y="21" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
      <!-- Title -->
      <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Frontend</text>
      <!-- Tech tags -->
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93C5FD">React • Next.js • TS</text>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Client State &amp; UI Runtimes</text>
      <text x="14" y="104" font-family="'Consolas', monospace" font-size="10" fill="#38BDF8">[SSR / SPA / Responsive]</text>
    </g>

    <!-- Flow Particle 1 -->
    <circle r="4.5" fill="#38BDF8">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 260 140 H 350"/>
    </circle>

    <!-- Module 2: Backend -->
    <g transform="translate(350, 75)">
      <rect width="210" height="126" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect width="210" height="34" rx="12" fill="#151A46" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Icon pill -->
      <rect x="14" y="8" width="34" height="18" rx="4" fill="#0E1236" stroke="#818CF8" stroke-width="1"/>
      <text x="31" y="21" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">{ }</text>
      <!-- Title -->
      <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Backend</text>
      <!-- Tech tags -->
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#C7D2FE">Java • Spring Boot</text>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">REST APIs, Node.js &amp; Auth</text>
      <text x="14" y="104" font-family="'Consolas', monospace" font-size="10" fill="#818CF8">[Spring Security / JWT]</text>
    </g>

    <!-- Flow Particle 2 -->
    <circle r="4.5" fill="#818CF8">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 560 140 H 650"/>
    </circle>

    <!-- Module 3: Database -->
    <g transform="translate(650, 75)">
      <rect width="210" height="126" rx="12" fill="url(#cardGrad)" stroke="#C084FC" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect width="210" height="34" rx="12" fill="#20133F" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Icon pill -->
      <rect x="14" y="8" width="34" height="18" rx="4" fill="#170C30" stroke="#C084FC" stroke-width="1"/>
      <text x="31" y="21" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">[( )]</text>
      <!-- Title -->
      <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Data Layer</text>
      <!-- Tech tags -->
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E9D5FF">PostgreSQL • MySQL</text>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Firebase &amp; Real-Time Schemas</text>
      <text x="14" y="104" font-family="'Consolas', monospace" font-size="10" fill="#C084FC">[ACID / Indexing / CDC]</text>
    </g>

    <!-- Flow Particle 3 -->
    <circle r="4.5" fill="#C084FC">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 860 140 H 950"/>
    </circle>

    <!-- Module 4: AI Layer -->
    <g transform="translate(950, 75)">
      <rect width="200" height="126" rx="12" fill="url(#cardGrad)" stroke="#F43F5E" stroke-opacity="0.8" stroke-width="1.5"/>
      <rect width="200" height="34" rx="12" fill="#2C0E22" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1"/>
      <!-- Icon pill -->
      <rect x="14" y="8" width="34" height="18" rx="4" fill="#1F0816" stroke="#F43F5E" stroke-width="1"/>
      <text x="31" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#F43F5E" text-anchor="middle">✦</text>
      <!-- Title -->
      <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI Engine</text>
      <!-- Tech tags -->
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FECDD3">Gemini • Llama</text>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Agentic Routing &amp; LLM APIs</text>
      <text x="14" y="104" font-family="'Consolas', monospace" font-size="10" fill="#F43F5E">[RAG / Function Calling]</text>
    </g>

    <!-- Bottom Tech Sub-footer -->
    <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5" text-anchor="middle">END-TO-END AUTONOMOUS APPLICATION LIFECYCLE • FROM PIXELS TO PRODUCTION</text>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="#253556" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
