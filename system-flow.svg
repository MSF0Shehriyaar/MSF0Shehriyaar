<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-label="Animated full-stack architecture pipeline">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1228"/><stop offset="1" stop-color="#12132D"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36D4F5"/><stop offset=".5" stop-color="#8599FF"/><stop offset="1" stop-color="#BC8AFF"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182745"/><stop offset="1" stop-color="#161C3A"/></linearGradient>
  </defs>
  <rect width="1200" height="254" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="252" rx="19" fill="none" stroke="#334869"/>
